name: Theseus
options:
  bundleIdPrefix: net.johnsolo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: WX2UGCD2SK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "92"
packages:
  ClaudeEngine:
    url: https://github.com/johnsusek/ClaudeEngine
    exactVersion: 0.1.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.2.0
  cmark-gfm:
    url: https://github.com/swiftlang/swift-cmark.git
    from: 0.9.0
  Subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    from: 1.0.2
  stagehand:
    url: https://github.com/johnsusek/stagehand
    branch: main
schemes:
  Theseus:
    build:
      targets:
        Theseus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TheseusTests
    archive:
      config: Release
targets:
  Theseus:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.plist"
          - "**/*.js"
          - MarkdownPage
      # The scripts the browser injects into pages, built from SafariPilot by scripts/update-page-scripts.sh.
      - path: App/Browser/page-content.js
        buildPhase: resources
      - path: App/Browser/page-main.js
        buildPhase: resources
      # The markdown preview's page: GitHub's stylesheet, highlight.js and GitHub's additions to cmark-gfm.
      - path: App/MarkdownPage
        buildPhase: resources
    dependencies:
      - package: ClaudeEngine
        product: ClaudeEngine
      - package: ClaudeEngine
        product: ClaudeWorkspace
      - package: Highlightr
      - package: cmark-gfm
        product: cmark-gfm
      - package: cmark-gfm
        product: cmark-gfm-extensions
      - package: Subprocess
        product: Subprocess
      - package: stagehand
        product: StagehandShared
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: © 2026 John Susek
        NSPrincipalClass: NSApplication
        # The browser loads any site, and dev servers on this Mac and the local network over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.Theseus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The transcript's pure parts, compiled straight into the bundle so the tests run without launching the app.
  TheseusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App/Browser/BrowserAddress.swift
      - path: App/Browser/BrowserKeys.swift
      - path: App/FilePaths.swift
      - path: App/Log.swift
      - path: App/Markdown.swift
      - path: App/MarkdownPage.swift
      - path: App/CodeHighlighter.swift
      - path: App/Desktop/DesktopChecks.swift
      - path: App/Desktop/DesktopScreenView.swift
      - path: App/Desktop/PrivateDesktop.swift
      - path: App/PermissionPrompt.swift
      - path: App/ProjectsModel.swift
      - path: App/SidebarModel.swift
      - path: App/StatusModel.swift
      - path: App/StorageDiff.swift
      - path: App/ToolPhrases.swift
      - path: App/TranscriptElement.swift
      - path: App/TranscriptRenderer.swift
      - path: App/TranscriptStyle.swift
    dependencies:
      - package: ClaudeEngine
        product: ClaudeEngine
      - package: ClaudeEngine
        product: ClaudeWorkspace
      - package: Highlightr
      - package: cmark-gfm
        product: cmark-gfm
      - package: cmark-gfm
        product: cmark-gfm-extensions
      - package: stagehand
        product: StagehandShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.TheseusTests
